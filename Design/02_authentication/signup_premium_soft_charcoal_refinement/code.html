<!DOCTYPE html>

<html class="dark" lang="en" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spend Analysis - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c6c6ce",
                        "on-error-container": "#ffdad6",
                        "on-secondary-container": "#b5b4bc",
                        "on-primary-fixed-variant": "#46464d",
                        "secondary": "#c6c6ce",
                        "surface-dim": "#121318",
                        "nav-surface": "#F9F9F9",
                        "on-background": "#e3e1e9",
                        "text-primary": "#F5F5F5",
                        "error": "#ffb4ab",
                        "accent-insight-blue": "#3B82F6",
                        "surface-container-high": "#292a2f",
                        "surface-container": "#1e1f24",
                        "surface": "#121318",
                        "primary-fixed-dim": "#c7c6ce",
                        "secondary-container": "#46464d",
                        "surface-container-lowest": "#0d0e13",
                        "on-surface": "#e3e1e9",
                        "inverse-surface": "#e3e1e9",
                        "status-error": "#EF4444",
                        "on-tertiary-fixed": "#191b23",
                        "accent-insight-purple": "#8B5CF6",
                        "surface-bright": "#38393e",
                        "on-secondary-fixed": "#1a1b21",
                        "on-tertiary": "#2e3038",
                        "primary-fixed": "#e3e1ea",
                        "surface-variant": "#34343a",
                        "status-warning": "#F59E0B",
                        "tertiary": "#c5c6d0",
                        "inverse-on-surface": "#2f3035",
                        "tertiary-fixed-dim": "#c5c6d0",
                        "on-error": "#690005",
                        "on-primary-container": "#85858c",
                        "on-tertiary-container": "#83858e",
                        "secondary-fixed": "#e3e1ea",
                        "surface-container-highest": "#34343a",
                        "text-secondary": "#A1A1AA",
                        "error-container": "#93000a",
                        "primary": "#c7c6ce",
                        "on-primary": "#2f3036",
                        "background": "#121318",
                        "on-tertiary-fixed-variant": "#45464f",
                        "outline": "#919095",
                        "outline-variant": "#46464b",
                        "inverse-primary": "#5d5e65",
                        "border-subtle": "rgba(255, 255, 255, 0.06)",
                        "on-secondary-fixed-variant": "#46464d",
                        "on-primary-fixed": "#1a1b21",
                        "on-secondary": "#2f3036",
                        "on-surface-variant": "#c7c6cb",
                        "surface-tint": "#c7c6ce",
                        "text-metadata": "#71717A",
                        "surface-container-low": "#1a1b20",
                        "status-success": "#10B981",
                        "primary-container": "#1c1d23",
                        "tertiary-container": "#1b1d25",
                        "tertiary-fixed": "#e1e2ec"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "16px",
                        "margin-desktop": "40px",
                        "margin-mobile": "20px",
                        "base": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-currency-mobile": ["Inter"],
                        "display-currency": ["Inter"],
                        "metadata": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-bold": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-currency-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "display-currency": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "metadata": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-glow:focus-within {
            box-shadow: 0 0 0 1px #8B5CF6;
            border-color: #8B5CF6;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-start overflow-x-hidden pt-8 pb-12 px-margin-mobile selection:bg-accent-insight-purple selection:text-white" style="background-color: #18191F;">
<!-- Header Section -->
<header class="w-full max-w-[390px] flex flex-col items-start mb-8">
<div class="mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-text-primary text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">analytics</span>
<span class="text-headline-md font-headline-md text-text-primary">Spend Analysis</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-text-primary mb-2">Create your account</h1>
<p class="text-body-lg font-body-lg text-text-secondary" style="color: #A7A8AE;">Set up your account to start understanding your spending.</p>
</header>
<!-- Main Form Section -->
<main class="w-full max-w-[390px] flex-1 flex flex-col gap-5">
<!-- Full Name -->
<div class="flex flex-col gap-1.5">
<label class="text-label-bold font-label-bold text-on-surface uppercase" for="fullName">Full name</label>
<div class="relative rounded-lg bg-surface-container border border-border-subtle input-glow transition-all duration-200" style="background-color: #292A30; border-color: rgba(255, 255, 255, 0.05);">
<input class="w-full bg-transparent border-none text-body-lg font-body-lg text-text-primary placeholder:text-text-secondary focus:ring-0 py-3.5 px-4 rounded-lg" id="fullName" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="text-label-bold font-label-bold text-on-surface uppercase" for="email">Email</label>
<div class="relative rounded-lg bg-surface-container border border-border-subtle input-glow transition-all duration-200" style="background-color: #292A30; border-color: rgba(255, 255, 255, 0.05);">
<input class="w-full bg-transparent border-none text-body-lg font-body-lg text-text-primary placeholder:text-text-secondary focus:ring-0 py-3.5 px-4 rounded-lg" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label class="text-label-bold font-label-bold text-on-surface uppercase" for="password">Password</label>
<div class="relative rounded-lg bg-surface-container border border-border-subtle input-glow transition-all duration-200 flex items-center pr-3" style="background-color: #292A30; border-color: rgba(255, 255, 255, 0.05);">
<input class="w-full bg-transparent border-none text-body-lg font-body-lg text-text-primary placeholder:text-text-secondary focus:ring-0 py-3.5 pl-4 rounded-lg" id="password" placeholder="Create a password" type="password"/>
<button aria-label="Toggle password visibility" class="p-1 text-text-secondary hover:text-text-primary transition-colors focus:outline-none" onclick="togglePassword('password', this)" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<span class="text-metadata font-metadata text-text-metadata mt-1" style="color: #A7A8AE;">Use at least 8 characters.</span>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-1.5 mt-2">
<label class="text-label-bold font-label-bold text-on-surface uppercase" for="confirmPassword">Confirm password</label>
<div class="relative rounded-lg bg-surface-container border border-border-subtle input-glow transition-all duration-200 flex items-center pr-3" style="background-color: #292A30; border-color: rgba(255, 255, 255, 0.05);">
<input class="w-full bg-transparent border-none text-body-lg font-body-lg text-text-primary placeholder:text-text-secondary focus:ring-0 py-3.5 pl-4 rounded-lg" id="confirmPassword" placeholder="Re-enter your password" type="password"/>
<button aria-label="Toggle password visibility" class="p-1 text-text-secondary hover:text-text-primary transition-colors focus:outline-none" onclick="togglePassword('confirmPassword', this)" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-4">
<div class="flex items-center h-5">
<input class="w-5 h-5 bg-surface-container border-border-subtle rounded text-accent-insight-purple focus:ring-accent-insight-purple focus:ring-2 focus:ring-offset-surface-dim focus:ring-offset-2" id="terms" type="checkbox" value=""/>
</div>
<label class="text-body-sm font-body-sm text-text-secondary leading-tight pt-[2px]" for="terms" style="color: #A7A8AE;">
                I agree to the <a class="text-text-primary hover:text-accent-insight-purple transition-colors font-medium" href="#">Terms of Service</a> and <a class="text-text-primary hover:text-accent-insight-purple transition-colors font-medium" href="#">Privacy Policy</a>.
            </label>
</div>
<!-- Actions -->
<div class="mt-8 flex flex-col gap-6">
<button class="w-full bg-primary-fixed-dim hover:bg-primary-fixed text-on-primary-fixed text-body-lg font-headline-md py-4 rounded-xl shadow-lg shadow-black/20 transition-all active:scale-[0.98] flex justify-center items-center">
                Create account
            </button>
<p class="text-center text-body-sm font-body-sm text-text-secondary" style="color: #A7A8AE;">
                Already have an account? <a class="text-accent-insight-purple hover:text-white transition-colors font-medium ml-1" href="#">Log in</a>
</p>
</div>
</main>
<!-- Trust Footer -->
<footer class="w-full max-w-[390px] mt-12 mb-4 border-border-subtle flex flex-col items-center justify-center opacity-80">
<p class="text-metadata font-metadata text-text-metadata text-center max-w-[300px] leading-relaxed" style="color: #A7A8AE;">
            Your financial information is accessed through consent-based connections. We never ask for your bank password or UPI PIN.
        </p>
</footer>
<script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const iconSpan = button.querySelector('span');
            if (input.type === 'password') {
                input.type = 'text';
                iconSpan.textContent = 'visibility';
                iconSpan.setAttribute('data-icon', 'visibility');
            } else {
                input.type = 'password';
                iconSpan.textContent = 'visibility_off';
                iconSpan.setAttribute('data-icon', 'visibility_off');
            }
        }
    </script>
</body></html>
