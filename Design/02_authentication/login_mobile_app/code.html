<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {

                        "on-background": "#e3e1e9",

                        "surface-container-high": "#292a2f",
                        "accent-insight-blue": "#3B82F6",
                        "surface-container-low": "#1a1b20",
                        "nav-surface": "#F9F9F9",
                        "error": "#ffb4ab",
                        "on-surface": "#e3e1e9",
                        "inverse-surface": "#e3e1e9",
                        "surface-dim": "#121318",
                        "background": "#121318",
                        "on-primary-fixed": "#1a1b21",
                        "surface-variant": "#34343a",
                        "on-tertiary-container": "#83858e",
                        "surface": "#121318",
                        "on-secondary-fixed-variant": "#46464d",
                        "status-warning": "#F59E0B",
                        "accent-insight-purple": "#8B5CF6",
                        "surface-bright": "#38393e",
                        "text-metadata": "#71717A",
                        "on-primary": "#2f3036",
                        "secondary-fixed": "#e3e1ea",
                        "border-subtle": "rgba(255, 255, 255, 0.06)",
                        "on-tertiary-fixed": "#191b23",
                        "tertiary-fixed-dim": "#c5c6d0",
                        "primary": "#c7c6ce",
                        "text-secondary": "#A1A1AA",
                        "text-primary": "#F5F5F5",
                        "on-primary-fixed-variant": "#46464d",
                        "secondary-fixed-dim": "#c6c6ce",
                        "on-tertiary-fixed-variant": "#45464f",
                        "secondary": "#c6c6ce",
                        "outline": "#919095",
                        "on-secondary-container": "#b5b4bc",
                        "surface-container": "#1e1f24",
                        "on-error": "#690005",
                        "primary-container": "#1c1d23",
                        "tertiary-fixed": "#e1e2ec",
                        "on-secondary": "#2f3036",
                        "surface-container-highest": "#34343a",
                        "secondary-container": "#46464d",
                        "inverse-on-surface": "#2f3035",
                        "on-primary-container": "#85858c",
                        "outline-variant": "#46464b",
                        "on-surface-variant": "#c7c6cb",
                        "surface-container-lowest": "#0d0e13",
                        "surface-tint": "#c7c6ce"
                    },
                    "borderRadius": {

<style>
        .glass-panel {
            background-color: #24252B;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .input-bg {
            background-color: #2B2D35;
        }
    </style>
</head>
<body class="bg-background text-text-primary antialiased min-h-screen flex flex-col items-center justify-center font-body-sm relative overflow-hidden">
<!-- Atmospheric background glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[300px] h-[300px] bg-accent-insight-blue/10 rounded-full blur-[100px] pointer-events-none"></div>
<div class="w-full max-w-[390px] px-margin-mobile flex flex-col h-[844px] justify-between relative z-10">
<div class="pt-12">
<!-- Brand Wordmark -->
<div class="flex items-center gap-2 mb-12">

<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-text-primary">Spend Analysis</h1>
</div>
<!-- Welcome Header -->
<div class="mb-8">
<h2 class="font-headline-lg text-headline-lg mb-2">Welcome back</h2>
<p class="font-body-sm text-body-sm text-text-secondary">Sign in to continue managing your spending.</p>
</div>
<!-- Login Form -->
<form class="space-y-8">
<!-- Email Field -->
<div>
<label class="block font-label-bold text-label-bold text-text-secondary mb-2 uppercase tracking-wider" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary">mail</span>
<input class="w-full h-12 pl-12 pr-4 rounded-lg input-bg border border-border-subtle text-text-primary placeholder:text-text-secondary/50 focus:outline-none focus:ring-1 focus:ring-accent-insight-blue focus:border-accent-insight-blue transition-colors" id="email" placeholder="Enter your email" required="" type="email" style="background-color: rgb(36, 37, 43); color: rgb(245, 245, 245);">
</div>
<!-- Hidden error state -->
<p class="hidden font-metadata text-metadata text-status-error mt-2 ml-1" id="email-error">Invalid email format.</p>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-text-secondary mb-2 uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary">lock</span>
<input class="w-full h-12 pl-12 pr-12 rounded-lg input-bg border border-border-subtle text-text-primary placeholder:text-text-secondary/50 focus:outline-none focus:ring-1 focus:ring-accent-insight-blue focus:border-accent-insight-blue transition-colors" id="password" placeholder="Enter your password" required="" type="password" style="background-color: rgb(36, 37, 43); color: rgb(245, 245, 245);">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-text-secondary hover:text-text-primary transition-colors focus:outline-none" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon">visibility</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="font-metadata text-metadata text-accent-insight-blue hover:text-accent-insight-blue/80 transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 rounded-full border border-border-subtle text-text-primary font-label-bold text-label-bold hover:bg-surface-container-highest active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm bg-surface-container-high" onclick="simulateLoading(this)" type="button">
<span id="btn-text" class="">Log in</span>
<span class="material-symbols-outlined animate-spin text-sm hidden" id="btn-spinner">progress_activity</span>
</button>
<!-- Sign Up Link -->
<div class="text-center mt-6">
<p class="font-body-sm text-body-sm text-text-secondary">Don't have an account? <a class="text-text-primary font-medium hover:underline" href="#">Create account</a></p>
</div>
</form>
</div>
<!-- Footer Note -->
<div class="pb-12 text-center px-4">

<p class="font-metadata text-metadata text-text-metadata leading-relaxed">
                Your financial information is accessed through consent-based connections. We never ask for your bank password or UPI PIN.
            </p>
</div>
</div>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('visibility-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function simulateLoading(btn) {
            const textSpan = document.getElementById('btn-text');
            const spinner = document.getElementById('btn-spinner');
            
            // Simple validation check for demonstration
            const email = document.getElementById('email').value;
            if(email === 'error@test.com') {
                document.getElementById('email-error').classList.remove('hidden');
                document.getElementById('email').classList.add('border-status-error', 'focus:border-status-error', 'focus:ring-status-error');
                return;
            } else {
                document.getElementById('email-error').classList.add('hidden');
                document.getElementById('email').classList.remove('border-status-error', 'focus:border-status-error', 'focus:ring-status-error');
            }

            textSpan.textContent = 'Signing in...';
            spinner.classList.remove('hidden');
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            setTimeout(() => {
                textSpan.textContent = 'Log in';
                spinner.classList.add('hidden');
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }, 2000);
        }
    </script>


</body></html>
