<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile Setup - Spend Analysis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "nav-surface": "#F9F9F9",
                        "surface-tint": "#c7c6ce",
                        "surface-container-low": "#1a1b20",
                        "secondary": "#c6c6ce",
                        "secondary-container": "#46464d",
                        "on-tertiary": "#2e3038",
                        "on-error": "#690005",
                        "tertiary-container": "#1b1d25",
                        "text-secondary": "#A1A1AA",
                        "status-success": "#10B981",
                        "on-secondary-container": "#b5b4bc",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#e3e1e9",
                        "surface-dim": "#121318",
                        "on-tertiary-fixed": "#191b23",
                        "on-secondary-fixed-variant": "#46464d",
                        "outline": "#919095",
                        "surface-container": "#1e1f24",
                        "primary": "#c7c6ce",
                        "surface-variant": "#34343a",
                        "status-error": "#EF4444",
                        "outline-variant": "#46464b",
                        "accent-insight-purple": "#8B5CF6",
                        "on-tertiary-fixed-variant": "#45464f",
                        "on-primary-container": "#85858c",
                        "accent-insight-blue": "#3B82F6",
                        "surface": "#121318",
                        "inverse-on-surface": "#2f3035",
                        "primary-container": "#1c1d23",
                        "secondary-fixed-dim": "#c6c6ce",
                        "on-primary-fixed-variant": "#46464d",
                        "text-metadata": "#71717A",
                        "on-background": "#e3e1e9",
                        "primary-fixed": "#e3e1ea",
                        "status-warning": "#F59E0B",
                        "surface-container-lowest": "#0d0e13",
                        "error": "#ffb4ab",
                        "on-primary": "#2f3036",
                        "secondary-fixed": "#e3e1ea",
                        "on-surface-variant": "#c7c6cb",
                        "inverse-primary": "#5d5e65",
                        "border-subtle": "rgba(255, 255, 255, 0.06)",
                        "tertiary-fixed": "#e1e2ec",
                        "tertiary-fixed-dim": "#c5c6d0",
                        "surface-bright": "#38393e",
                        "surface-container-highest": "#34343a",
                        "on-primary-fixed": "#1a1b21",
                        "text-primary": "#F5F5F5",
                        "on-surface": "#e3e1e9",
                        "surface-container-high": "#292a2f",
                        "on-tertiary-container": "#83858e",
                        "tertiary": "#c5c6d0",
                        "background": "#121318",
                        "primary-fixed-dim": "#c7c6ce",
                        "on-secondary-fixed": "#1a1b21",
                        "on-secondary": "#2f3036",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-mobile": "20px",
                        "gutter": "16px",
                        "margin-desktop": "40px",
                        "container-padding": "16px"
                    },
                    "fontFamily": {
                        "display-currency": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-bold": ["Inter"],
                        "metadata": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-currency-mobile": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "display-currency": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-bold": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "metadata": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-currency-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #18191F; /* Soft Charcoal Override as requested */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Custom scrollbar for horizontal chips */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-text-primary min-h-screen flex flex-col items-center justify-center py-8 px-4 sm:px-6 lg:px-8">
<!-- Mobile Container -->
<main class="w-full max-w-md mx-auto flex flex-col h-full bg-[#18191F] relative pb-24">
<!-- Header Section -->
<header class="w-full px-margin-mobile pt-8 pb-6 flex flex-col gap-6">
<div class="flex items-center justify-center w-full">
<span class="font-headline-md text-headline-md text-text-primary font-bold tracking-tight">Spend Analysis</span>
</div>
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-text-primary">Set up your profile</h1>
<p class="font-body-sm text-body-sm text-text-secondary">Tell us a little about your preferences so we can personalize your spending analysis.</p>
</div>
</header>
<!-- Form Section -->
<section class="flex-1 px-margin-mobile flex flex-col gap-6">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-text-secondary uppercase tracking-wider" for="fullName">Full name</label>
<div class="relative w-full">
<input class="w-full bg-[#292A30] border border-border-subtle rounded-lg px-4 py-3 font-body-lg text-body-lg text-text-primary focus:outline-none focus:border-accent-insight-purple focus:ring-1 focus:ring-accent-insight-purple transition-colors placeholder:text-text-secondary/50" id="fullName" type="text" value="Amit Sharma"/>
</div>
</div>
<!-- Monthly Income -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-text-secondary uppercase tracking-wider" for="monthlyIncome">Monthly income</label>
<span class="font-metadata text-metadata text-text-secondary/70 bg-[#292A30] px-2 py-0.5 rounded-full border border-border-subtle">Optional</span>
</div>
<div class="relative w-full flex items-center">
<span class="absolute left-4 font-body-lg text-body-lg text-text-secondary">₹</span>
<input class="w-full bg-[#292A30] border border-border-subtle rounded-lg pl-8 pr-4 py-3 font-body-lg text-body-lg text-text-primary focus:outline-none focus:border-accent-insight-purple focus:ring-1 focus:ring-accent-insight-purple transition-colors placeholder:text-text-secondary/50" id="monthlyIncome" placeholder="Enter your monthly income" type="number"/>
</div>
</div>
<!-- Monthly Savings Target -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-text-secondary uppercase tracking-wider" for="savingsTarget">Monthly savings target</label>
<span class="font-metadata text-metadata text-text-secondary/70 bg-[#292A30] px-2 py-0.5 rounded-full border border-border-subtle">Optional</span>
</div>
<div class="relative w-full flex items-center">
<span class="absolute left-4 font-body-lg text-body-lg text-text-secondary">₹</span>
<input class="w-full bg-[#292A30] border border-border-subtle rounded-lg pl-8 pr-4 py-3 font-body-lg text-body-lg text-text-primary focus:outline-none focus:border-accent-insight-purple focus:ring-1 focus:ring-accent-insight-purple transition-colors placeholder:text-text-secondary/50" id="savingsTarget" placeholder="Set your savings target" type="number"/>
</div>
</div>
<!-- Currency Selection (Static) -->
<div class="flex flex-col gap-2 pt-2">
<label class="font-label-bold text-label-bold text-text-secondary uppercase tracking-wider">Currency</label>
<div class="w-full bg-[#202126] border border-border-subtle rounded-lg px-4 py-3 flex items-center justify-between">
<span class="font-body-lg text-body-lg text-text-primary">₹ INR</span>
<span class="material-symbols-outlined text-text-secondary">keyboard_arrow_down</span>
</div>
</div>
<!-- Preferences -->
<div class="flex flex-col gap-4 pt-4">
<label class="font-label-bold text-label-bold text-text-secondary uppercase tracking-wider">What's most important to you?</label>
<div class="flex flex-wrap gap-3">
<button class="px-4 py-2 bg-[#292A30] border border-accent-insight-purple rounded-full font-body-sm text-body-sm text-accent-insight-purple flex items-center gap-2 transition-colors hover:bg-accent-insight-purple/10">
<span class="material-symbols-outlined text-[18px]">check</span>
                        Save more
                    </button>
<button class="px-4 py-2 bg-[#202126] border border-border-subtle rounded-full font-body-sm text-body-sm text-text-secondary flex items-center gap-2 transition-colors hover:bg-[#292A30]">
                        Control daily spending
                    </button>
<button class="px-4 py-2 bg-[#202126] border border-border-subtle rounded-full font-body-sm text-body-sm text-text-secondary flex items-center gap-2 transition-colors hover:bg-[#292A30]">
                        Stay within budget
                    </button>
<button class="px-4 py-2 bg-[#202126] border border-border-subtle rounded-full font-body-sm text-body-sm text-text-secondary flex items-center gap-2 transition-colors hover:bg-[#292A30]">
                        Understand where my money goes
                    </button>
</div>
</div>
</section>
<!-- Actions & Footer -->
<div class="w-full px-margin-mobile pt-8 pb-4 flex flex-col items-center gap-4 mt-auto">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-3.5 rounded-xl hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center font-semibold">
                Continue
            </button>
<button class="font-body-sm text-body-sm text-text-secondary hover:text-text-primary transition-colors py-2">
                Skip for now
            </button>
<p class="font-metadata text-metadata text-text-secondary/60 text-center mt-4">
                You can update these preferences anytime in Settings.
            </p>
</div>
</main>
<script>
        // Simple chip selection toggle for demonstration
        document.querySelectorAll('button').forEach(btn => {
            if(btn.parentElement.classList.contains('flex-wrap')) {
                btn.addEventListener('click', function() {
                    const isSelected = this.classList.contains('border-accent-insight-purple');
                    
                    if(isSelected) {
                        this.classList.remove('border-accent-insight-purple', 'text-accent-insight-purple', 'bg-[#292A30]');
                        this.classList.add('border-border-subtle', 'text-text-secondary', 'bg-[#202126]');
                        const icon = this.querySelector('.material-symbols-outlined');
                        if(icon) icon.remove();
                    } else {
                        this.classList.add('border-accent-insight-purple', 'text-accent-insight-purple', 'bg-[#292A30]');
                        this.classList.remove('border-border-subtle', 'text-text-secondary', 'bg-[#202126]');
                        this.insertAdjacentHTML('afterbegin', '<span class="material-symbols-outlined text-[18px]">check</span>');
                    }
                });
            }
        });
    </script>
</body></html>
