<style>
        .glass-effect {
            background: linear-gradient(145deg, rgba(32,31,31,0.6) 0%, rgba(20,19,19,0.8) 100%);

            -webkit-backdrop-filter: blur(20px);
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-sm min-h-screen w-full relative overflow-x-hidden selection:bg-primary-fixed-dim selection:text-on-primary-fixed">
<!-- Top Action Bar -->
<header class="w-full px-margin-mobile py-6 flex justify-between items-center z-10 sticky top-0 bg-background/80 backdrop-blur-md">
<button class="h-10 w-10 rounded-full bg-surface-container flex items-center justify-center border border-border-subtle hover:bg-surface-container-high active:scale-95 transition-all">
<span class="material-symbols-outlined text-on-surface" data-icon="close">close</span>
</button>
<button class="h-10 w-10 rounded-full bg-surface-container flex items-center justify-center border border-border-subtle hover:bg-surface-container-high active:scale-95 transition-all text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="w-full px-margin-mobile pt-4 pb-32 flex flex-col items-center max-w-md mx-auto">
<!-- Hero: Merchant & Amount -->
<div class="flex flex-col items-center mb-6 w-full">
<div class="h-20 w-20 rounded-full bg-surface-container-highest flex items-center justify-center border border-border-subtle mb-6 shadow-[0_0_40px_rgba(255,255,255,0.03)] relative">
<span class="material-symbols-outlined text-4xl text-on-surface" data-icon="restaurant">restaurant</span>
<!-- Success Indicator -->
<div class="absolute -bottom-1 -right-1 h-6 w-6 rounded-full bg-status-success flex items-center justify-center border-2 border-background">
<span class="material-symbols-outlined text-on-primary-fixed" data-icon="check" data-weight="fill" style="font-size: 14px;">check</span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-1">Tea Shop</h1>
<p class="font-display-currency-mobile text-display-currency-mobile text-on-background mb-4 tracking-tight">₹20</p>
<div class="px-4 py-1.5 rounded-full bg-surface-container border border-border-subtle flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="local_dining" style="font-size: 16px;">local_dining</span>
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">Food</span>
</div>
</div>
<!-- Details Bento Box -->
<div class="w-full glass-effect rounded-[24px] border border-border-subtle p-5 flex flex-col gap-5 shadow-lg shadow-black/20">
<!-- Date & Time -->
<div class="flex justify-between items-center pb-5 border-b border-border-subtle/50">
<div class="flex items-center gap-3">
<div class="h-10 w-10 rounded-full bg-surface flex items-center justify-center text-on-surface-variant border border-border-subtle/50">
<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Date &amp; Time</span>
</div>
<span class="font-body-lg text-body-lg text-on-background font-medium">Today · 9:15 AM</span>
</div>
<!-- Payment Method -->
<div class="flex justify-between items-center pb-5 border-b border-border-subtle/50">
<div class="flex items-center gap-3">
<div class="h-10 w-10 rounded-full bg-accent-insight-blue/10 flex items-center justify-center text-accent-insight-blue border border-accent-insight-blue/20">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Paid via</span>
</div>
<div class="text-right flex flex-col items-end">
<span class="font-body-lg text-body-lg text-on-background font-medium">Google Pay</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Account XXXX 4821</span>
</div>
</div>
<!-- Description -->
<div class="flex justify-between items-start">
<div class="flex items-center gap-3">
<div class="h-10 w-10 rounded-full bg-surface flex items-center justify-center text-on-surface-variant border border-border-subtle/50">
<span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-2.5">Description</span>
</div>
<div class="bg-surface-container-highest/50 px-4 py-2.5 rounded-xl border border-border-subtle/50 mt-1 max-w-[60%]">
<span class="font-body-sm text-body-sm text-on-background block text-right break-words">Chai &amp; snacks</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full mt-6 grid grid-cols-2 gap-4">
<button class="w-full py-3.5 rounded-xl bg-surface-container border border-border-subtle flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="split" style="font-size: 20px;">csv</span>
<span class="font-label-bold text-label-bold text-on-surface">Split</span>
</button>
<button class="w-full py-3.5 rounded-xl bg-surface-container border border-border-subtle flex items-center justify-center gap-2 hover:bg-surface-container-high transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="flag" style="font-size: 20px;">flag</span>
<span class="font-label-bold text-label-bold text-on-surface">Report</span>
</button>
</div>
</main>
<!-- BottomNavBar Component from JSON -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] rounded-full border border-border-subtle bg-nav-surface/90 backdrop-blur-xl shadow-lg shadow-black/10 z-50 md:hidden flex justify-around items-center px-4 py-2">
<!-- Home - Inactive -->
<a class="flex flex-col items-center justify-center text-on-tertiary-fixed-variant px-4 py-2 hover:text-on-primary-fixed transition-colors scale-105 active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-bold text-label-bold hidden">Home</span>
</a>
<!-- Analytics - Inactive -->
<a class="flex flex-col items-center justify-center text-on-tertiary-fixed-variant px-4 py-2 hover:text-on-primary-fixed transition-colors scale-105 active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="insights">insights</span>
<span class="font-label-bold text-label-bold hidden">Analytics</span>
</a>
<!-- Transactions - ACTIVE -->
<a class="flex flex-col items-center justify-center bg-primary-fixed-dim text-on-primary-fixed rounded-full px-6 py-2 transition-all duration-300 scale-105 active:scale-95" href="#">
<span class="material-symbols-outlined mb-1" data-icon="receipt_long" data-weight="fill">receipt_long</span>
<span class="font-label-bold text-label-bold">Transactions</span>
</a>
<!-- Budget - Inactive -->
<a class="flex flex-col items-center justify-center text-on-tertiary-fixed-variant px-4 py-2 hover:text-on-primary-fixed transition-colors scale-105 active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label-bold text-label-bold hidden">Budget</span>
</a>
<!-- Settings - Inactive -->
<a class="flex flex-col items-center justify-center text-on-tertiary-fixed-variant px-4 py-2 hover:text-on-primary-fixed transition-colors scale-105 active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-bold text-label-bold hidden">Settings</span>
</a>
</nav>
